<title>アルバム20</title>
<style>
:root{ --cream:#fdf9f4; --ink:#4a3f38; --accent:#8a9a7b; --line:#e5d9cc; }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#fff;color:var(--ink);
  font-family:"Hiragino Mincho ProN","Noto Serif JP","Yu Mincho",serif;}
.toolbar{position:sticky;top:0;z-index:50;display:flex;gap:8px;align-items:center;
  padding:10px 14px;background:rgba(253,249,244,.96);border-bottom:1px solid var(--line);
  backdrop-filter:blur(6px);flex-wrap:wrap}
.toolbar strong{font-size:14px;margin-right:auto;letter-spacing:.05em}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:22px;
  padding:10px 18px;font-size:14px;font-family:inherit;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.active{background:#c96f6f;border-color:#c96f6f;color:#fff}
.hint{width:100%;font-size:12px;color:#8d7f74;padding:2px 4px 6px}
main{max-width:820px;margin:0 auto;padding:8px}
.sec{position:relative;background:#fff;box-shadow:0 2px 12px rgba(74,63,56,.15);
  aspect-ratio:210/297;padding:2mm;margin:0 auto 14px;
  display:flex;flex-direction:column}
.sec-del{display:none;position:absolute;top:-16px;right:6px;z-index:20;
  border:1px solid #c96f6f;background:#fff;color:#c96f6f;border-radius:18px;
  padding:6px 10px;font-size:12px;font-family:inherit;cursor:pointer}
body.editing .sec-del{display:block}
.secfoot{flex:0 0 auto;text-align:center;font-size:10px;color:#a3958a;letter-spacing:.08em;padding-top:3px;outline:none}
body.editing .secfoot{outline:1px dashed var(--accent)}
.grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,1fr);grid-auto-flow:dense;gap:3px;min-height:0;width:100%}
.cell{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;gap:2px}
.cell.wide{grid-column:span 2}
/* 見出し行（7月版と同じ：タイトル＋日付・下に線） */
.page-head{flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  border-bottom:2px solid var(--accent);padding:2px 4px 6px;margin-bottom:8px}
.page-head h2{font-size:20px;font-weight:600;letter-spacing:.08em;outline:none}
.page-date{font-size:13px;color:#8d7f74;letter-spacing:.06em;white-space:nowrap;outline:none}
/* 写真の下の一言（サムネの説明） */
.cell figcaption.cap{flex:0 0 auto;font-size:11px;line-height:1.4;color:#6d5f54;min-height:1.4em;padding:0 2px;letter-spacing:.03em;outline:none;overflow:hidden}
body.editing .cell figcaption.cap{background:#fff;border-radius:3px;box-shadow:inset 0 0 0 1px var(--line)}
body.editing .page-head h2, body.editing .page-date{background:#fff;border-radius:3px;box-shadow:inset 0 0 0 1px var(--line);padding:0 6px}
.frame{flex:1;min-height:0;overflow:hidden;background:#eee;border-radius:0;border:1.5px solid #b9aa9a}
.sec{border:1.5px solid #b9aa9a}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.frame.empty{display:flex;align-items:center;justify-content:center;background:#f5efe8}
body.editing .frame.empty::after{content:'＋ 写真';font-size:16px;color:#b8a894}
.cell-del{display:none;position:absolute;top:-9px;right:-9px;z-index:5;width:24px;height:24px;
  border-radius:50%;border:none;background:#c96f6f;color:#fff;font-size:13px;cursor:pointer;padding:0}
/* 小さいタイトルラベル（ドラッグで好きな場所へ） */
.label{position:absolute;z-index:10;display:inline-block;max-width:96%;overflow:hidden;
  background:rgba(253,249,244,.92);border:1px solid var(--line);border-radius:4px;
  padding:2px 10px;font-size:13px;letter-spacing:.06em;color:var(--ink);white-space:normal;max-width:44%;line-height:1.5;text-align:left}
.label .label-del{display:none;position:absolute;top:-11px;right:-11px;width:22px;height:22px;
  border-radius:50%;border:none;background:#c96f6f;color:#fff;font-size:12px;cursor:pointer;padding:0}
.label .label-text{outline:none}
.label .label-grip{display:none;cursor:move;color:#8a9a7b;user-select:none}
body.editing .label .label-grip{display:inline}
/* タイトルの文字サイズ（編集中だけ A−／A＋ を出す） */
.label .label-sz{display:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:4px;
  font-size:11px;line-height:1;padding:3px 5px;margin-right:4px;cursor:pointer;font-family:inherit;vertical-align:middle}
body.editing .label .label-sz{display:inline-block}
body.editing .frame{outline:2px dashed var(--accent);outline-offset:-2px;cursor:pointer}
.editing .frame img{touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.cell.adjusting img{touch-action:none}
body.editing .cell-del{display:block}
body.editing .label{cursor:move;box-shadow:0 1px 6px rgba(138,154,123,.5)}
body.editing .label .label-del{display:block}
body.placing main{cursor:crosshair}
[contenteditable]:focus{outline:2px dashed var(--accent);outline-offset:1px;background:#fff}
.cell.adjusting .frame{outline:3px solid #c9a882!important}
.cell.adjusting img{touch-action:none}
/* 🔀 入れ替え中：移す先の枠を選ぶ */
body.swapping .frame{outline:3px dashed #c96f6f!important;outline-offset:-3px}
#swapMsg{display:none;position:fixed;left:0;right:0;bottom:0;z-index:100;padding:14px 16px;text-align:center;
  background:#c96f6f;color:#fff;font-size:15px;letter-spacing:.05em}
.adjust-panel{position:fixed;left:0;right:0;bottom:0;z-index:100;display:none;
  background:rgba(253,249,244,.98);border-top:1px solid var(--line);padding:12px 16px;
  box-shadow:0 -2px 12px rgba(74,63,56,.15)}
.adjust-panel.show{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.adjust-panel label{font-size:13px;white-space:nowrap}
.adjust-panel input[type=range]{flex:1;min-width:140px;height:36px}
footer{max-width:900px;margin:6px auto 30px;text-align:center;font-size:11px;color:#a3958a}
@media (max-width:640px){ main{padding:4px} .grid{gap:4px} }
@media print{
  .toolbar,footer,.hint,.cell-del,.label-del,.sec-del,#addPageBtn{display:none!important}
  main{max-width:none;padding:0}
  .sec{box-shadow:none;aspect-ratio:auto;width:210mm;height:297mm;margin:0;
    padding:9mm;page-break-after:always;break-inside:avoid}
  .grid{gap:1mm}
  .frame{outline:none!important;border:0.5mm solid #b9aa9a}
  .sec{border:0.6mm solid #b9aa9a;box-sizing:border-box}
  .frame.empty{visibility:hidden}
  .label{font-size:10pt;background:rgba(255,255,255,.9)}
  .secfoot{font-size:8pt;padding-top:1mm}
  .page-head{padding:0 1mm 2mm;margin-bottom:2.5mm}
  .page-head h2{font-size:15pt}
  .page-date{font-size:9pt}
  .cell figcaption.cap{font-size:7.5pt;line-height:1.35;min-height:1.35em}
  @page{size:A4 portrait;margin:0}
}
/* ブラウザが付けるヘッダー/フッター（URL・日時・ページ番号）を出さないため、余白ゼロを最上位でも宣言 */
@page{size:A4 portrait;margin:0}
</style>
</head>

<script>
let editing=false, placing=false, targetImg=null, targetFrame=null;
const pick=document.getElementById('filePick');

function toggleEdit(){
  editing=!editing;
  if(!editing&&placing) stopLabel();
  document.body.classList.toggle('editing',editing);
  const b=document.getElementById('editBtn');
  b.classList.toggle('active',editing);
  b.textContent=editing?'✅ 編集おわり':'✏️ 編集モード';
  document.getElementById('hint').style.display=editing?'block':'none';
  document.getElementById('labelBtn').style.display=editing?'':'none';
  document.getElementById('addPageBtn').style.display=editing?'':'none';
  document.getElementById('resetBtn').style.display=editing?'':'none';
  if(editing) ensureLabelTools();
  document.querySelectorAll('.label-text,.secfoot,.cap,.ph-title,.page-date').forEach(el=>el.setAttribute('contenteditable',editing?'true':'false'));
  if(!editing) closeAdjust();
}
document.querySelectorAll('.label-text,.secfoot,.cap,.ph-title,.page-date').forEach(el=>el.setAttribute('contenteditable','false'));

function addPage(){
  const sec=document.getElementById('secTpl').content.firstElementChild.cloneNode(true);
  document.querySelector('main .sec:last-of-type').after(sec);
  fillDateDefaults(sec);
  if(editing) sec.querySelectorAll('.secfoot,.cap,.ph-title,.page-date').forEach(el=>el.setAttribute('contenteditable','true'));
  sec.scrollIntoView({behavior:'smooth'});
}

function startLabel(){ placing=!placing; document.body.classList.toggle('placing',placing);
  document.getElementById('labelBtn').classList.toggle('active',placing); }
function stopLabel(){ placing=false; document.body.classList.remove('placing');
  document.getElementById('labelBtn').classList.remove('active'); }

function makeLabel(sec,xPct,yPct,text){
  const n=document.createElement('span');
  n.className='label'; n.style.left=xPct+'%'; n.style.top=yPct+'%';
  n.innerHTML='<button class="label-del">✕</button><span class="label-grip">⠿ </span><button class="label-sz" data-d="-1">A−</button><button class="label-sz" data-d="1">A＋</button><span class="label-text" contenteditable="true"></span>';
  n.querySelector('.label-text').textContent=text||'タイトル';
  sec.appendChild(n); return n;
}
/* 保存済みファイルの古いタイトルにも A−／A＋ を付ける（編集モードに入る時） */
function ensureLabelTools(){
  document.querySelectorAll('.label').forEach(lb=>{
    if(lb.querySelector('.label-sz')) return;
    const grip=lb.querySelector('.label-grip'), txt=lb.querySelector('.label-text');
    const html='<button class="label-sz" data-d="-1">A−</button><button class="label-sz" data-d="1">A＋</button>';
    (grip||txt).insertAdjacentHTML(grip?'afterend':'beforebegin',html);
  });
}
function labelSize(lb,dir){
  const cur=parseFloat(lb.style.fontSize)||13;
  lb.style.fontSize=Math.max(9,Math.min(40,cur+dir*2))+'px';
}
/* タイトルを写真の角に吸い付ける（角から24px以内で離した時。ボタン不要） */
function snapLabel(n){
  const sec=n.closest('.sec'); if(!sec) return;
  const r=sec.getBoundingClientRect(), lr=n.getBoundingClientRect();
  let best=null, bestD=24;
  sec.querySelectorAll('.frame').forEach(fr=>{
    const f=fr.getBoundingClientRect();
    [
      {x:f.left, y:f.top,    lx:lr.left,  ly:lr.top},
      {x:f.right,y:f.top,    lx:lr.right, ly:lr.top},
      {x:f.left, y:f.bottom, lx:lr.left,  ly:lr.bottom},
      {x:f.right,y:f.bottom, lx:lr.right, ly:lr.bottom}
    ].forEach(c=>{ const d=Math.hypot(c.x-c.lx,c.y-c.ly); if(d<bestD){ bestD=d; best=c; } });
  });
  if(!best) return;
  const nl=lr.left+(best.x-best.lx), nt=lr.top+(best.y-best.ly);
  n.style.right='auto';
  n.style.left=Math.max(0,(nl-r.left)/r.width*100)+'%';
  n.style.top =Math.max(0,(nt-r.top)/r.height*100)+'%';
}

function createEmptyCell(){
  const cell=document.createElement('figure');
  cell.className='cell';
  cell.innerHTML='<button class="cell-del">✕</button><div class="frame empty"></div><figcaption class="cap" contenteditable="'+(editing?'true':'false')+'"></figcaption>';
  return cell;
}
function findLastEmptyCell(sec,exceptCell){
  const cells=[...sec.querySelectorAll('.grid > .cell')];
  for(let i=cells.length-1;i>=0;i--){
    if(cells[i]!==exceptCell&&cells[i].querySelector('.frame.empty')) return cells[i];
  }
  return null;
}
function addEmptyCellAfter(cell){ cell.after(createEmptyCell()); }
function swapWideState(cellA,cellB){
  const aWide=cellA.classList.contains('wide'), bWide=cellB.classList.contains('wide');
  if(aWide===bWide) return true;
  const secA=cellA.closest('.sec'), secB=cellB.closest('.sec');
  if(secA===secB){
    cellA.classList.toggle('wide',bWide);
    cellB.classList.toggle('wide',aWide);
    return true;
  }
  const gainCell=aWide?cellB:cellA, loseCell=aWide?cellA:cellB;
  const removable=findLastEmptyCell(gainCell.closest('.sec'),gainCell);
  if(!removable) return false;
  removable.remove();
  gainCell.classList.add('wide');
  loseCell.classList.remove('wide');
  addEmptyCellAfter(loseCell);
  return true;
}

document.addEventListener('click',e=>{
  const secDel=e.target.closest('.sec-del');
  if(secDel){
    const secs=document.querySelectorAll('.sec');
    if(secs.length===1){ alert('最後の1ページは消せません'); return; }
    const sec=secDel.closest('.sec');
    if(sec.querySelector('.frame img')||sec.querySelector('.label')){
      alert('写真かタイトルが入っているページは消せません（先に✕で空にしてください）'); return;
    }
    sec.remove(); return;
  }
  const szBtn=e.target.closest('.label-sz');
  if(szBtn){ labelSize(szBtn.closest('.label'),+szBtn.dataset.d); e.preventDefault(); return; }
  if(e.target.closest('.label-del')){ e.target.closest('.label').remove(); return; }
  if(e.target.closest('.cell-del')){
    const cell=e.target.closest('.cell'), wasWide=cell.classList.contains('wide');
    const fr=cell.querySelector('.frame');
    fr.innerHTML=''; fr.classList.add('empty');
    cell.classList.remove('adjusting','wide');
    if(wasWide) addEmptyCellAfter(cell);
    return;
  }
  if(placing){
    if(e.target.closest('.toolbar')) return;
    const sec=e.target.closest('.sec'); if(!sec) return;
    const r=sec.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width*100, y=(e.clientY-r.top)/r.height*100;
    const n=makeLabel(sec,Math.min(x,72),Math.min(y,95),'');
    snapLabel(n);
    stopLabel(); n.querySelector('.label-text').focus();
    e.preventDefault(); e.stopPropagation(); return;
  }
  if(!editing) return;
  /* 「🔀 入れ替え」中：次にタップした枠と入れ替える（ドラッグ不要・別ページでもOK） */
  if(swapSrc){
    if(e.target.closest('.toolbar')||e.target.closest('.adjust-panel')){ cancelSwapPick(); return; }
    const fr=e.target.closest('.frame');
    e.preventDefault(); e.stopPropagation();
    if(fr && fr!==swapSrc.closest('.frame')) swapInto(swapSrc,fr);
    cancelSwapPick(); return;
  }
  const emptyF=e.target.closest('.frame.empty');
  if(emptyF){ targetFrame=emptyF; targetImg=null; pick.value=''; pick.click(); return; }
  const img=e.target.closest('.frame img');
  if(img){ openAdjust(img); }
  else if(!e.target.closest('.adjust-panel')) closeAdjust();
},true);

/* ---- ズーム・位置調整 ---- */
let adjImg=null;
const adjPanel=document.getElementById('adjPanel');
const adjZoom=document.getElementById('adjZoom');
function getT(img){
  return {s:parseFloat(img.dataset.s||1), x:parseFloat(img.dataset.x||0), y:parseFloat(img.dataset.y||0),
          px:parseFloat(img.dataset.px||50), py:parseFloat(img.dataset.py||50)};
}
function setT(img,t){
  const m=(t.s-1)*50/t.s;
  t.x=Math.max(-m,Math.min(m,t.x)); t.y=Math.max(-m,Math.min(m,t.y));
  t.px=Math.max(0,Math.min(100,t.px)); t.py=Math.max(0,Math.min(100,t.py));
  img.dataset.s=t.s; img.dataset.x=t.x; img.dataset.y=t.y; img.dataset.px=t.px; img.dataset.py=t.py;
  img.style.objectPosition=t.px+'% '+t.py+'%';
  img.style.transform=`scale(${t.s}) translate(${t.x}%,${t.y}%)`;
}
function openAdjust(img){
  if(adjImg) adjImg.closest('.cell').classList.remove('adjusting');
  adjImg=img; targetImg=img;
  img.closest('.cell').classList.add('adjusting');
  adjZoom.value=getT(img).s*100;
  adjPanel.classList.add('show');
}
function closeAdjust(){
  if(adjImg) adjImg.closest('.cell').classList.remove('adjusting');
  adjImg=null; adjPanel.classList.remove('show');
}
function nudge(dx,dy){
  if(!adjImg) return;
  const t=getT(adjImg);
  if(t.s>1){ t.x-=dx*4; t.y-=dy*4; }
  else{ t.px+=dx*8; t.py+=dy*8; }   // 等倍: 見せる位置をずらす（ズームしない）
  setT(adjImg,t);
}
function replacePhoto(){ if(adjImg){ targetImg=adjImg; pick.value=''; pick.click(); } }
/* ---- 🔀 入れ替え（タップ2回・ドラッグ不要） ---- */
let swapSrc=null;
function swapInto(a,fr){
  const srcFr=a.closest('.frame');
  if(!swapWideState(srcFr.closest('.cell'),fr.closest('.cell'))) return false;
  const b=fr.querySelector('img');
  if(b){
    const t=a.src; a.src=b.src; b.src=t;
    ['s','x','y','px','py'].forEach(k=>{const v=a.dataset[k];a.dataset[k]=b.dataset[k]||'';b.dataset[k]=v||'';});
    [a,b].forEach(im=>setT(im,getT(im)));
  }else{
    fr.appendChild(a); fr.classList.remove('empty');
    srcFr.innerHTML=''; srcFr.classList.add('empty');
  }
  return true;
}
function startSwapPick(){
  if(!adjImg) return;
  swapSrc=adjImg; closeAdjust();
  document.body.classList.add('swapping');
  document.getElementById('swapMsg').style.display='block';
}
function cancelSwapPick(){
  swapSrc=null; document.body.classList.remove('swapping');
  document.getElementById('swapMsg').style.display='none';
}
/* 見出しの日付：初期値「2026年　月」のままなら、開いた時／ページ追加時に今の年月を入れる（書き換えは自由） */
function fillDateDefaults(root){
  const d=new Date(), txt=d.getFullYear()+'年'+(d.getMonth()+1)+'月';
  (root||document).querySelectorAll('.page-date').forEach(el=>{ if(el.textContent.trim()==='2026年　月'||el.textContent.trim()==='') el.textContent=txt; });
}
/* ＋／−ボタンで拡大縮小（iPadでスライダーやピンチが効かない時の確実な手段） */
function zoomStep(dir){
  if(!adjImg) return;
  const t=getT(adjImg);
  t.s=Math.max(1,Math.min(3,Math.round((t.s+dir*0.2)*10)/10));
  setT(adjImg,t); adjZoom.value=t.s*100;
}
/* iPad Safari のピンチ（gestureイベント）でも拡大縮小できるようにする */
let gestureBaseS=null;
document.addEventListener('gesturestart',e=>{
  if(!adjImg) return;
  gestureBaseS=getT(adjImg).s; e.preventDefault();
},{passive:false});
document.addEventListener('gesturechange',e=>{
  if(!adjImg||gestureBaseS===null) return;
  const t=getT(adjImg);
  t.s=Math.max(1,Math.min(3,gestureBaseS*e.scale));
  setT(adjImg,t); adjZoom.value=t.s*100; e.preventDefault();
},{passive:false});
document.addEventListener('gestureend',e=>{ gestureBaseS=null; if(adjImg) e.preventDefault(); },{passive:false});
adjZoom.addEventListener('input',()=>{
  if(!adjImg) return;
  const t=getT(adjImg); t.s=adjZoom.value/100; setT(adjImg,t);
});
/* 調整中: 写真ドラッグで位置移動 */
let panStart=null, pinchStart=null;
const adjPointers=new Map();
function adjPointerDistance(){
  const p=[...adjPointers.values()];
  return Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
}
document.addEventListener('pointerdown',e=>{
  if(!adjImg) return;
  if(e.target!==adjImg) return;
  if(adjPointers.size>=2) return;
  adjPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const t=getT(adjImg);
  if(adjPointers.size===2){
    pinchStart={distance:Math.max(1,adjPointerDistance()),s:t.s};
    panStart=null;
  }else{
    panStart={pxl:e.clientX,pyl:e.clientY,...t,w:adjImg.closest('.frame').getBoundingClientRect().width};
  }
  adjImg.setPointerCapture(e.pointerId);
  e.preventDefault();
});
document.addEventListener('pointermove',e=>{
  if(!adjImg||!adjPointers.has(e.pointerId)) return;
  adjPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(adjPointers.size===2&&pinchStart){
    const t=getT(adjImg);
    t.s=Math.max(1,Math.min(3,pinchStart.s*adjPointerDistance()/pinchStart.distance));
    setT(adjImg,t); adjZoom.value=t.s*100; e.preventDefault(); return;
  }
  if(!panStart) return;
  const t=getT(adjImg);
  const dx=(e.clientX-panStart.pxl)/panStart.w*100, dy=(e.clientY-panStart.pyl)/panStart.w*100;
  if(t.s>1){ t.x=panStart.x+dx/t.s; t.y=panStart.y+dy/t.s; }
  else{ t.px=panStart.px-dx; t.py=panStart.py-dy; }
  setT(adjImg,t); e.preventDefault();
},{passive:false});
document.addEventListener('pointerup',e=>{
  adjPointers.delete(e.pointerId); pinchStart=null;
  if(adjPointers.size===1&&adjImg){
    const p=[...adjPointers.values()][0],t=getT(adjImg);
    panStart={pxl:p.x,pyl:p.y,...t,w:adjImg.closest('.frame').getBoundingClientRect().width};
  }else panStart=null;
});
document.addEventListener('pointercancel',e=>{
  adjPointers.delete(e.pointerId); panStart=null; pinchStart=null;
});

/* ラベルのドラッグ移動 */
let drag=null, off={x:0,y:0};
document.addEventListener('pointerdown',e=>{
  if(!editing) return;
  const n=e.target.closest('.label');
  if(!n||e.target.closest('.label-del')||e.target.closest('.label-sz')) return;
  if(e.target.closest('.label-text')) return; // 文字タップは編集に譲る
  drag=n; const r=n.getBoundingClientRect();
  off={x:e.clientX-r.left,y:e.clientY-r.top};
  n.setPointerCapture(e.pointerId); e.preventDefault();
});
document.addEventListener('pointermove',e=>{
  if(!drag) return;
  const sec=drag.closest('.sec'), r=sec.getBoundingClientRect();
  const wPct=drag.getBoundingClientRect().width/r.width*100;
  const hPct=drag.getBoundingClientRect().height/r.height*100;
  drag.style.right='auto';
  drag.style.left=Math.max(0,Math.min((e.clientX-off.x-r.left)/r.width*100,100-wPct))+'%';
  drag.style.top =Math.max(0,Math.min((e.clientY-off.y-r.top)/r.height*100,100-hPct))+'%';
  e.preventDefault();
});
document.addEventListener('pointerup',()=>{ if(drag) snapLabel(drag); drag=null; });
document.addEventListener('pointercancel',()=>{ drag=null; });

/* 写真差し替え（枠に合わせて中央トリミング・枠は崩れない） */
pick.addEventListener('change',()=>{
  const f=pick.files[0]; if(!f||(!targetImg&&!targetFrame)) return;
  const pickedImg=targetImg, pickedFrame=targetFrame;
  const fr=new FileReader();
  fr.onload=ev=>{
    const im=new Image();
    im.onload=()=>{
      const cell=(pickedFrame||pickedImg).closest('.cell');
      const wasWide=cell.classList.contains('wide'), wantsWide=im.width>im.height;
      const removable=wantsWide&&!wasWide?findLastEmptyCell(cell.closest('.sec'),cell):null;
      const makeWide=wantsWide&&(wasWide||!!removable);
      const TW=makeWide?1000:600,TH=680;
      let sw=im.width,sh=im.height,sx=0,sy=0;
      if(sw/sh>TW/TH){const nw=sh*TW/TH;sx=(sw-nw)/2;sw=nw}
      else{const nh=sw*TH/TW;sy=(sh-nh)/2;sh=nh}
      const cv=document.createElement('canvas');cv.width=TW;cv.height=TH;
      cv.getContext('2d').drawImage(im,sx,sy,sw,sh,0,0,TW,TH);
      const data=cv.toDataURL('image/jpeg',0.6);
      if(makeWide&&!wasWide){ removable.remove(); cell.classList.add('wide'); }
      else if(!makeWide&&wasWide){ cell.classList.remove('wide'); addEmptyCellAfter(cell); }
      else cell.classList.toggle('wide',makeWide);
      if(pickedFrame){
        const im2=document.createElement('img'); im2.src=data;
        pickedFrame.classList.remove('empty'); pickedFrame.appendChild(im2);
        if(targetFrame===pickedFrame) targetFrame=null;
      }else{
        pickedImg.src=data;
        setT(pickedImg,{s:1,x:0,y:0,px:50,py:50}); if(adjImg===pickedImg) adjZoom.value=100;
      }
    };
    im.src=ev.target.result;
  };
  fr.readAsDataURL(f);
});

async function exportHtml(){
  if(editing) toggleEdit();
  const clone=document.documentElement.cloneNode(true);
  const blob=new Blob(['<!DOCTYPE html>\n'+clone.outerHTML],{type:'text/html'});
  if(window.showSaveFilePicker){
    try{
      if(!window._fh){
        window._fh=await showSaveFilePicker({suggestedName:'アルバム_20枚バージョン.html',
          types:[{description:'HTML',accept:{'text/html':['.html']}}]});
      }
      const w=await window._fh.createWritable(); await w.write(blob); await w.close();
      alert('✅ 上書き保存しました');
      return;
    }catch(e){ if(e&&e.name==='AbortError') return; window._fh=null; }
  }
  const d=new Date();
  const fname='アルバム_日常の様子_'+d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)+'.html';
  /* iPad/iPhone：共有シートで「ファイルに保存」「プリント」「AirDrop」を選べる（画面が飛ばない） */
  if(navigator.share && navigator.canShare){
    try{
      const file=new File([blob],fname,{type:'text/html'});
      if(navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:fname}); return; }
    }catch(e){ if(e&&e.name==='AbortError') return; }
  }
  const a=document.createElement('a');
  a.download=fname; a.href=URL.createObjectURL(blob); a.target='_blank'; a.rel='noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  alert('📥 ダウンロードに保存されました（このブラウザは上書き保存に非対応）');
}
</script>

<script>
/* ---- 写真ドラッグで入れ替え（編集モード中・写真を掴んで別の枠へ） ---- */
let swDrag=null, swGhost=null, swMoved=false;
function endSwap(e){
  const dragState=swDrag, didMove=swMoved;
  try{
    if(e&&e.type==='pointerup'&&dragState&&didMove){
      const el=document.elementFromPoint(e.clientX,e.clientY);
      const fr=el&&el.closest('.frame');
      const srcFr=dragState.img.closest('.frame');
      if(fr&&fr!==srcFr){
        swapInto(dragState.img,fr);
      }
      const stop=ev=>{ev.stopPropagation();ev.preventDefault();};
      document.addEventListener('click',stop,true);
      setTimeout(()=>document.removeEventListener('click',stop,true),400);
    }
  }finally{
    if(dragState){ clearTimeout(dragState.timer); dragState.img.style.opacity=''; }
    if(swGhost) swGhost.remove();
    document.querySelectorAll('body > .sw-ghost').forEach(el=>el.remove());
    swDrag=null; swGhost=null; swMoved=false;
  }
}
document.addEventListener('pointerdown',e=>{
  endSwap();
  if(!editing||adjImg) return;
  if(e.target.closest('.label')||e.target.closest('.toolbar')||e.target.closest('.cell-del')) return;
  const img=e.target.closest('.frame img'); if(!img) return;
  swDrag={img:img,sx:e.clientX,sy:e.clientY,cx:e.clientX,cy:e.clientY,pointerId:e.pointerId,timer:null};
  swDrag.timer=setTimeout(()=>{
    if(!swDrag||swDrag.pointerId!==e.pointerId) return;
    swMoved=true;
    try{ swDrag.img.setPointerCapture(swDrag.pointerId); }catch(_){ }
    swGhost=document.createElement('img'); swGhost.className='sw-ghost'; swGhost.src=swDrag.img.src;
    swGhost.style.cssText='position:fixed;width:84px;height:94px;object-fit:cover;z-index:9999;pointer-events:none;opacity:.85;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.4)';
    document.body.appendChild(swGhost);
    swDrag.img.style.opacity='.3';
    swGhost.style.left=(swDrag.cx-42)+'px'; swGhost.style.top=(swDrag.cy-47)+'px';
  },450);
},true);
document.addEventListener('pointermove',e=>{
  if(!swDrag||e.pointerId!==swDrag.pointerId) return;
  swDrag.cx=e.clientX; swDrag.cy=e.clientY;
  if(!swMoved){
    if(Math.hypot(e.clientX-swDrag.sx,e.clientY-swDrag.sy)>=12) endSwap(e);
    return;
  }
  swGhost.style.left=(e.clientX-42)+'px'; swGhost.style.top=(e.clientY-47)+'px';
  e.preventDefault();
},{passive:false});
document.addEventListener('pointerup',endSwap);
document.addEventListener('pointercancel',endSwap);
document.addEventListener('lostpointercapture',endSwap);

/* ---- 自動保存（この端末のブラウザ内・IndexedDB）----
   Safariを閉じても、次に同じURLを開くと前回の続きから始まる。💾保存（ファイル書き出し）とは別。
   写真入りの保存済みファイルを開いた時は、その中身を優先して自動保存の復元はしない。 */
const AS_DB='album20_autosave', AS_KEY='main';
function asOpen(){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open(AS_DB,1);
  r.onupgradeneeded=()=>{ r.result.createObjectStore('kv'); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); }
function asGet(){ return asOpen().then(db=>new Promise((res,rej)=>{ const t=db.transaction('kv','readonly').objectStore('kv').get(AS_KEY); t.onsuccess=()=>res(t.result||null); t.onerror=()=>rej(t.error); })).catch(()=>null); }
function asSet(v){ return asOpen().then(db=>new Promise((res,rej)=>{ const t=db.transaction('kv','readwrite').objectStore('kv').put(v,AS_KEY); t.onsuccess=()=>res(true); t.onerror=()=>rej(t.error); })).catch(()=>false); }
function asDel(){ return asOpen().then(db=>new Promise((res,rej)=>{ const t=db.transaction('kv','readwrite').objectStore('kv').delete(AS_KEY); t.onsuccess=()=>res(true); t.onerror=()=>rej(t.error); })).catch(()=>false); }
const asMain=document.querySelector('main'), asStat=document.getElementById('autoStat');
const asPristine=asMain.innerHTML;
let asTimer=null, asReady=false;
function asHasContent(){ return !!(asMain.querySelector('.frame img')||asMain.querySelector('.label')); }
function asFmt(t){ const d=new Date(t); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function asSave(){
  if(!asReady) return;
  clearTimeout(asTimer);
  asTimer=setTimeout(()=>{
    asSet({html:asMain.innerHTML,t:Date.now()}).then(ok=>{ if(asStat) asStat.textContent=ok?('自動保存 '+asFmt(Date.now())):'（自動保存できません）'; });
  },800);
}
new MutationObserver(()=>asSave()).observe(asMain,{subtree:true,childList:true,attributes:true,characterData:true});
function resetAlbum(){
  if(!confirm('写真とタイトルを全部消して白紙に戻します。よろしいですか？\n（💾保存したファイルは消えません）')) return;
  asReady=false;
  asDel().then(()=>{ asMain.innerHTML=asPristine; document.querySelectorAll('.label-text,.secfoot,.cap,.ph-title,.page-date').forEach(el=>el.setAttribute('contenteditable',editing?'true':'false')); if(asStat) asStat.textContent='白紙に戻しました'; asReady=true; });
}
asGet().then(saved=>{
  if(saved && saved.html && !asHasContent()){
    asMain.innerHTML=saved.html;
    document.querySelectorAll('.label-text,.secfoot,.cap,.ph-title,.page-date').forEach(el=>el.setAttribute('contenteditable','false'));
    if(asStat) asStat.textContent='前回の続き（'+asFmt(saved.t)+'）';
  }
  fillDateDefaults();
  /* 復元そのものを「変更」として保存し直さないよう、少し待ってから自動保存を有効にする */
  setTimeout(()=>{ asReady=true; },1200);
});

document.addEventListener('touchmove',e=>{
  if(swMoved||(adjImg&&(panStart||pinchStart))) e.preventDefault();

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ---- 📄 PDFで印刷：Safariの印刷を使わずページをそのままPDFにする（URL・日時のヘッダー/フッターが付かない） ---- */
async function makePdf(){
  if(typeof html2canvas!=='function'||!window.jspdf){ alert('PDF機能の読み込みに失敗しました。通信状態を確認して、もう一度開いてください。'); return; }
  if(editing) toggleEdit();
  closeAdjust();
  const btn=document.getElementById('pdfBtn'); const old=btn.textContent; btn.textContent='作成中…'; btn.disabled=true;
  try{
    const secs=[...document.querySelectorAll('main .sec')];
    const pdf=new jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});
    for(let i=0;i<secs.length;i++){
      const cv=await html2canvas(secs[i],{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});
      if(i>0) pdf.addPage();
      pdf.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,210,297,undefined,'FAST');
    }
    const blob=pdf.output('blob');
    const d=new Date(), fname='アルバム_'+d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)+'.pdf';
    if(navigator.share&&navigator.canShare){
      const file=new File([blob],fname,{type:'application/pdf'});
      if(navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:fname}); return; }catch(e){ if(e&&e.name==='AbortError') return; } }
    }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname; a.target='_blank'; a.rel='noopener';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  }catch(e){ alert('PDFを作れませんでした：'+(e&&e.message?e.message:e)); }
  finally{ btn.textContent=old; btn.disabled=false; }
}
</script>
</body></html>
