function updatePhoto(i){const group=art.querySelector(`[data-photo="${i}"]`);group.replaceChildren();if(data.photos[i])group.append(make('image',{href:data.photos[i].src,...photoBox(i),preserveAspectRatio:'none'}));art.querySelector(`[data-index="${i}"]`).classList.toggle('has-photo',!!data.photos[i]);}
function startDrag(e,i){
 if(loading||drag||e.isPrimary===false||(e.pointerType==='mouse'&&e.button!==0))return;
 select(i);if(!data.photos[i])return;
 e.preventDefault();e.stopPropagation();
 const p=data.photos[i];drag={i,id:e.pointerId,x:e.clientX,y:e.clientY,dx:p.dx,dy:p.dy,moved:false};
 e.currentTarget.setPointerCapture(e.pointerId);
}
function moveDrag(e){
 if(!drag||drag.id!==e.pointerId)return;
 if(e.cancelable)e.preventDefault();e.stopPropagation();
 const bounds=art.getBoundingClientRect(),mx=e.clientX-drag.x,my=e.clientY-drag.y;
 drag.moved ||=Math.abs(mx)+Math.abs(my)>3;
 if(!drag.moved)return;
 Object.assign(data.photos[drag.i],{dx:drag.dx+mx*data.width/bounds.width,dy:drag.dy+my*data.height/bounds.height});
 updatePhoto(drag.i);
}
function endDrag(e){
 if(!drag||drag.id!==e.pointerId)return;
 if(e.cancelable)e.preventDefault();e.stopPropagation();
 if(drag.moved)changed();drag=null;
}
function cancelDrag(){if(drag?.moved)changed();drag=null;}
function nudgePhoto(x,y){
 const p=data.photos[selected];if(!p||loading)return;
 const beforeX=p.dx,beforeY=p.dy,step=data.frames[selected].w/30;
 p.dx+=x*step;p.dy+=y*step;updatePhoto(selected);
 if(p.dx===beforeX&&p.dy===beforeY){say('この方向は端まで動いています。「拡大」を少し上げると調整範囲が広がります。');return;}
 changed();say('選択した写真の位置を調整しました。');
}
for(const [id,x,y] of [['move-left',-1,0],['move-up',0,-1],['move-down',0,1],['move-right',1,0]])$(id).onclick=()=>nudgePhoto(x,y);
art.addEventListener('touchmove',e=>{if(drag&&e.cancelable)e.preventDefault();},{passive:false});

art.parentElement.addEventListener('dragstart',e=>e.preventDefault());

data.frames.forEach((_,i)=>$('frame-select').add(new Option('写真 '+(i+1),i)));$('frame-select').onchange=()=>select(+$('frame-select').value);$('choose').onclick=()=>$('file').click();
$('file').onchange=async()=>{const file=$('file').files[0],i=selected;$('file').value='';if(!file)return;loading++;say('写真を読み込んでいます…');try{const src=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});const img=new Image();img.src=src;await img.decode();const scale=Math.min(1,1800/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.round(img.naturalWidth*scale);canvas.height=Math.round(img.naturalHeight*scale);const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);data.photos[i]={src:canvas.toDataURL('image/jpeg',.92),width:canvas.width,height:canvas.height,zoom:1,dx:0,dy:0};updatePhoto(i);select(i);changed();say('写真を入れました。ドラッグか矢印で位置、「拡大」で大きさを調整できます。差し替えは「写真を入れる・差し替える」を押してください。')}catch(e){say('この写真を読み込めませんでした。JPEGまたはPNGの写真を選んでください。')}finally{loading--}};
$('zoom').oninput=()=>{if(!data.photos[selected])return;data.photos[selected].zoom=+$('zoom').value;updatePhoto(selected);$('zoom-value').value=Math.round(+$('zoom').value*100)+'%';changed()};
$('center').onclick=()=>{Object.assign(data.photos[selected],{zoom:1,dx:0,dy:0});updatePhoto(selected);select(selected);changed()};
$('remove').onclick=()=>{data.photos[selected]=null;updatePhoto(selected);select(selected);changed()};
function preparePrint(){const pages=$('print-pages');pages.replaceChildren();for(let i=0;i<2;i++){const section=document.createElement('section');section.className='print-page';const svg=make('svg',{viewBox:`${i*data.width/2} 0 ${data.width/2} ${data.height}`,preserveAspectRatio:'none'});scene(svg,'print'+i+'-',false);section.append(svg);pages.append(section)}}
window.addEventListener('beforeprint',preparePrint);$('print').onclick=async()=>{if(loading){say('写真の読み込み完了後に印刷してください。');return}preparePrint();await new Promise(r=>setTimeout(r,100));window.print()};
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
const backup=()=>({format:'keiro-sea8-ipad-v1',photos:data.photos,labels:{left:data.labels.left,right:data.labels.right,date:data.labels.date}});
let draftTimer=null,revision=0,dbPromise=null;
function openDB(){if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{const request=indexedDB.open('keiro-photo-sea8-20260921',1);request.onupgradeneeded=()=>request.result.createObjectStore('draft');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)});return dbPromise}
async function writeDraft(){const rev=revision;try{const db=await openDB();await new Promise((resolve,reject)=>{const tx=db.transaction('draft','readwrite');tx.objectStore('draft').put(backup(),'current');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)});if(rev===revision)dirty=false;}catch{say('この端末への一時保存ができません。「編集データを保存」で保存してください。')}}
function changed(){dirty=true;revision++;clearTimeout(draftTimer);draftTimer=setTimeout(writeDraft,600)}
function validateBackup(value){if(value?.format!=='keiro-sea8-ipad-v1'||!Array.isArray(value.photos)||value.photos.length!==data.frames.length)throw Error('format');for(const p of value.photos){if(p===null)continue;if(!p||typeof p.src!=='string'||!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(p.src)||!['width','height','zoom','dx','dy'].every(k=>typeof p[k]==='number'&&Number.isFinite(p[k]))||p.width<=0||p.height<=0||p.width>50000||p.height>50000||p.zoom<1||p.zoom>4)throw Error('photo');}return {photos:value.photos,labels:{left:typeof value.labels?.left==='string'?value.labels.left.slice(0,12):'',right:typeof value.labels?.right==='string'?value.labels.right.slice(0,12):'',date:typeof value.labels?.date==='string'?value.labels.date.slice(0,12):''}}}
async function applyBackup(value){const {photos,labels}=validateBackup(value);for(const p of photos){if(!p)continue;const img=new Image();img.src=p.src;await img.decode();if(img.naturalWidth!==p.width||img.naturalHeight!==p.height)throw Error('dimensions');}data.photos=photos;data.labels=labels;for(const [id,key] of [['name-left','left'],['name-right','right'],['date-text','date']])$(id).value=labels[key];scene(art,'edit-',true);select(0)}
async function restoreDraft(){const rev=revision;try{const db=await openDB(),value=await new Promise((resolve,reject)=>{const request=db.transaction('draft').objectStore('draft').get('current');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)});if(value&&rev===revision&&!loading){const {photos,labels}=validateBackup(value);if(rev===revision){data.photos=photos;data.labels=labels;for(const [id,key] of [['name-left','left'],['name-right','right'],['date-text','date']])$(id).value=labels[key];scene(art,'edit-',true);select(0);say('この端末に一時保存した写真を戻しました。')}}}catch{/* Manual backup remains available. */}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&dirty){clearTimeout(draftTimer);writeDraft()}});
const SAVE_KEY='keiro-sea8-save-name';try{$('save-name').value=localStorage.getItem(SAVE_KEY)||'';$('name-left').value=data.labels.left||'';$('name-right').value=data.labels.right||'';$('date-text').value=data.labels.date||''}catch{}$('save-name').addEventListener('input',()=>{try{localStorage.setItem(SAVE_KEY,$('save-name').value)}catch{}});function fname(suffix){const clean=v=>(v||'').trim().replace(/[\\/:*?"<>|\s.]+/g,'');const save=clean($('save-name').value),fallback=[$('name-left').value&&clean($('name-left').value)+'さま',$('name-right').value&&clean($('name-right').value)+'さま'].filter(Boolean).join('_');const n=save||fallback;const d=new Date(),z=v=>String(v).padStart(2,'0');const t=`${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`;return `敬老の日_海8枠_${n?n+'_':''}${t}_${suffix}`}$('save').onclick=()=>{if(loading)return say('写真の読み込み完了後に保存してください。');download(new Blob([JSON.stringify(backup())],{type:'application/json'}),fname('編集データ.json'));say('保存先で「ファイルに保存」を選んでください。次回は「保存データを開く」で続きから編集できます。')};
$('restore').onclick=()=>$('backup-file').click();
$('backup-file').onchange=async()=>{const file=$('backup-file').files[0];$('backup-file').value='';if(!file)return;if(file.size>80000000)return say('データが大きすぎるため読み込めません。');if(data.photos.some(Boolean)&&!confirm('今の写真を、保存データの写真に入れ替えますか？'))return;loading++;try{await applyBackup(JSON.parse(await file.text()));changed();say('保存データを開きました。')}catch{say('読み込めませんでした。この画面で保存した編集データを選んでください。')}finally{loading--}};
let exportFile=null,exportURL=null,exportFiles=[];
const loadImage=src=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src=src});
$('image-export').onclick=async()=>{if(loading)return say('写真の読み込みが終わるまでお待ちください。');$('image-export').disabled=true;try{const canvas=document.createElement('canvas');canvas.width=3508;canvas.height=2480;const ctx=canvas.getContext('2d');ctx.save();ctx.scale(canvas.width/data.width,canvas.height/data.height);ctx.drawImage(await loadImage(data.background),0,0,data.width,data.height);for(let i=0;i<data.frames.length;i++){if(!data.photos[i])continue;const box=photoBox(i),img=await loadImage(data.photos[i].src);ctx.save();ctx.clip(new Path2D(data.frames[i].path));ctx.drawImage(img,box.x,box.y,box.width,box.height);ctx.restore()}ctx.restore();drawCanvasLabels(ctx,canvas.width/data.width,canvas.height/data.height);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('export');exportFile=new File([blob],fname('完成.png'),{type:'image/png'});exportFiles=[exportFile];$('export-preview2').style.display='none';if(exportURL)URL.revokeObjectURL(exportURL);exportURL=URL.createObjectURL(blob);$('export-preview').src=canvas.toDataURL('image/png');$('share-image').disabled=false;$('export-status').textContent='画像を長押しして保存することもできます。';$('image-dialog').showModal()}catch{say('画像の作成に失敗しました。もう一度お試しください。')}finally{$('image-export').disabled=false}};
$('share-image').onclick=async()=>{if(!exportFiles.length)return;try{if(navigator.canShare?.({files:exportFiles})){await navigator.share({files:exportFiles});}else{exportFiles.forEach(f=>download(f,f.name));$('export-status').textContent='ダウンロードした画像を「ファイル」で開けます。'}}catch(e){if(e.name!=='AbortError')$('export-status').textContent='画像を長押しして保存してください。'}};
$('a4-export').onclick=async()=>{if(loading)return say('写真の読み込みが終わるまでお待ちください。');$('a4-export').disabled=true;try{const half=data.width/2,files=[],previews=[];for(let pIdx=0;pIdx<2;pIdx++){const canvas=document.createElement('canvas');canvas.width=1754;canvas.height=2480;const ctx=canvas.getContext('2d');ctx.save();ctx.scale(canvas.width/half,canvas.height/data.height);ctx.translate(-pIdx*half,0);ctx.fillStyle='#fff';ctx.fillRect(pIdx*half,0,half,data.height);ctx.drawImage(await loadImage(data.background),0,0,data.width,data.height);for(let i=0;i<data.frames.length;i++){if(!data.photos[i])continue;const box=photoBox(i),img=await loadImage(data.photos[i].src);ctx.save();ctx.clip(new Path2D(data.frames[i].path));ctx.drawImage(img,box.x,box.y,box.width,box.height);ctx.restore()}ctx.restore();drawCanvasLabels(ctx,canvas.width/half,canvas.height/data.height,-pIdx*half);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('export');files.push(new File([blob],fname(pIdx===0?'A4_1枚目_左.png':'A4_2枚目_右.png'),{type:'image/png'}));previews.push(canvas.toDataURL('image/png'))}exportFiles=files;exportFile=files[0];$('export-preview').src=previews[0];const pv2=$('export-preview2');pv2.src=previews[1];pv2.style.display='block';$('share-image').disabled=false;$('export-status').textContent='A4サイズ2枚です。「共有・保存」で2枚まとめて写真に保存→写真アプリから印刷するとURLは入りません。';$('image-dialog').showModal()}catch{say('画像の作成に失敗しました。もう一度お試しください。')}finally{$('a4-export').disabled=false}};
$('close-image').onclick=()=>$('image-dialog').close();
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});scene(art,'edit-',true);select(0);$('startup-note').hidden=true;restoreDraft();
})();
